<!--
  notification_relay template body for "sto-management-denied".
  Paste as the "body" via /ui/templates, with:
    template_name:  sto-management-denied
    subject:        STO Request Denied by Management
    required_vars:  (leave empty)
  Sent by sendManagementDeniedEmail() in ../src/lib/notify.ts, fired from
  POST /api/sto/:id/management and POST /api/sto/:id/receiving-management
  when approved=false.
-->
<div style="font-family: -apple-system, Segoe UI, Arial, sans-serif; max-width: 640px; margin: 0 auto;">
  <div style="background:#0f1c33; padding:20px 24px; border-radius:8px 8px 0 0;">
    <span style="color:#7fb2e5; font-size:12px; letter-spacing:1px; text-transform:uppercase;">STO Management</span>
    <h2 style="color:#fbfaf6; margin:6px 0 0; font-size:20px;">STO Request Denied by Management</h2>
  </div>
  <div style="border:1px solid #d8d3c5; border-top:none; border-radius:0 0 8px 8px; padding:24px;">
    <p style="font-size:15px; color:#1a2029; margin:0 0 20px;">
      Management approval was denied. The STO request cannot proceed.
    </p>
    <table cellpadding="0" cellspacing="0" style="width:100%; border-collapse:collapse; font-size:14px;">
      <tr><td colspan="2" style="padding:10px 0 6px; border-bottom:2px solid #8a3f1d; color:#8a3f1d; font-weight:600; font-size:12px; text-transform:uppercase; letter-spacing:0.5px;">Details</td></tr>
      <tr><td style="padding:6px 0; color:#4a5364; width:45%;">STO Number</td><td style="padding:6px 0; color:#1a2029; font-weight:600;">{{.sto_id}}</td></tr>
      <tr><td style="padding:6px 0; color:#4a5364;">Denial Reason</td><td style="padding:6px 0; color:#1a2029;">{{.denial_reason}}</td></tr>
      <tr><td style="padding:6px 0; color:#4a5364;">Approving Site</td><td style="padding:6px 0; color:#1a2029;">{{.approving_site}}</td></tr>
    </table>
  </div>
</div>
