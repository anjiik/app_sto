<!--
  notification_relay template body for "sto-shipment-executed".
  Paste as the "body" via /ui/templates, with:
    template_name:  sto-shipment-executed
    subject:        STO Shipment Executed
    required_vars:  (leave empty)
  Sent by sendReadyToShipAndExecutedEmails() in ../src/lib/notify.ts, fired
  from POST /api/sto/:id/logistics alongside sto-ready-to-ship, when
  ready_to_ship=true and the STO moves to RECEIVING_LOGISTICS.
-->
<div style="font-family: -apple-system, Segoe UI, Arial, sans-serif; max-width: 640px; margin: 0 auto;">
  <div style="background:#0f1c33; padding:20px 24px; border-radius:8px 8px 0 0;">
    <span style="color:#7fb2e5; font-size:12px; letter-spacing:1px; text-transform:uppercase;">STO Management</span>
    <h2 style="color:#fbfaf6; margin:6px 0 0; font-size:20px;">STO Shipment Executed</h2>
  </div>
  <div style="border:1px solid #d8d3c5; border-top:none; border-radius:0 0 8px 8px; padding:24px;">
    <p style="font-size:15px; color:#1a2029; margin:0 0 20px;">
      The shipment has been executed and the request has moved to Receiving Site Logistics.
    </p>
    <table cellpadding="0" cellspacing="0" style="width:100%; border-collapse:collapse; font-size:14px;">
      <tr><td style="padding:6px 0; color:#4a5364; width:45%;">STO Number</td><td style="padding:6px 0; color:#1a2029; font-weight:600;">{{.sto_id}}</td></tr>
      <tr><td style="padding:6px 0; color:#4a5364;">Actual Ship Date</td><td style="padding:6px 0; color:#1a2029;">{{.actual_ship_date}}</td></tr>
      <tr><td style="padding:6px 0; color:#4a5364;">Shipment ID</td><td style="padding:6px 0; color:#1a2029;">{{.shipment_id}}</td></tr>
      <tr><td style="padding:6px 0; color:#4a5364;">Tracking / Reference Details</td><td style="padding:6px 0; color:#1a2029;">{{.tracking_reference}}</td></tr>
    </table>
  </div>
</div>
