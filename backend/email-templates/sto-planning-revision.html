<!--
  notification_relay template body for "sto-planning-revision".

  This is NOT deployed automatically — it's reference source for the relay's
  own template store. To (re)create it there, paste this file's contents as
  the "body" field via the relay UI (/ui/templates) or its API, with:

    template_name:  sto-planning-revision
    subject:        STO Request Requires Revision
    required_vars:  (leave empty — see sto-planning-queue.html for why)

  Sent by sendPlanningReviewEmail('revise', ...) in ../src/lib/notify.ts,
  fired from POST /api/sto/:id/planning when the outcome is "revise". Note:
  this app records one free-text "notes" field for a revision (no separate
  quantity/detail-change field), rendered below as Planning's revision note.
-->
<div style="font-family: -apple-system, Segoe UI, Arial, sans-serif; max-width: 640px; margin: 0 auto;">
  <div style="background:#0f1c33; padding:20px 24px; border-radius:8px 8px 0 0;">
    <span style="color:#7fb2e5; font-size:12px; letter-spacing:1px; text-transform:uppercase;">STO Management</span>
    <h2 style="color:#fbfaf6; margin:6px 0 0; font-size:20px;">STO Request Requires Revision</h2>
  </div>
  <div style="border:1px solid #d8d3c5; border-top:none; border-radius:0 0 8px 8px; padding:24px;">
    <p style="font-size:15px; color:#1a2029; margin:0 0 20px;">
      Your STO request requires revision and has been returned to the requestor for update.
    </p>
    <table cellpadding="0" cellspacing="0" style="width:100%; border-collapse:collapse; font-size:14px;">
      <tr><td colspan="2" style="padding:10px 0 6px; border-bottom:2px solid #b5542a; color:#b5542a; font-weight:600; font-size:12px; text-transform:uppercase; letter-spacing:0.5px;">Details</td></tr>
      <tr><td style="padding:6px 0; color:#4a5364; width:45%;">STO Number</td><td style="padding:6px 0; color:#1a2029; font-weight:600;">{{.sto_id}}</td></tr>
      <tr><td style="padding:6px 0; color:#4a5364;">Reason for Revision / Notes from Planning</td><td style="padding:6px 0; color:#1a2029;">{{.planning_notes}}</td></tr>
    </table>
  </div>
</div>
